name: agrifarm
description: "CoLearn — National Cooperative Learning Ecosystem (NCCT, Ministry of Cooperation, Govt. of India)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.3.0

  # Google Maps
  google_maps_flutter: ^2.9.0

  # Camera & Image
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Location & Sensor
  geolocator: ^13.0.2
  flutter_compass: ^0.8.0

  # HTTP & Networking
  http: ^1.2.2
  dio: ^5.7.0

  # Local storage
  shared_preferences: ^2.3.2

  # Fonts
  google_fonts: ^6.2.1

  # Permissions
  permission_handler: ^11.3.1

  # UI helpers
  shimmer: ^3.0.0

  # Path utilities
  path_provider: ^2.1.4
  path: ^1.9.0

  # Intl
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
